[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvarapala"
version = "0.2.0"
description = "Permission gates, consent levels, and tamper-evident audit logs for AI agents and MCP servers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raja" }]
keywords = [
    "ai",
    "agents",
    "mcp",
    "llm",
    "security",
    "audit",
    "permissions",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
dvarapala = "dvarapala.cli:main"

[project.urls]
Homepage = "https://github.com/demolished-lab/dvarapala"
Issues = "https://github.com/demolished-lab/dvarapala/issues"

[tool.setuptools.packages.find]
include = ["dvarapala*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
